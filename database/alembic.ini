# Alembic configuration for Yonder.
# Default local URL uses SQLite. Override with:
#   alembic -c database/alembic.ini -x dburl=postgresql+psycopg://yonder:yonder@127.0.0.1:5432/yonder upgrade head

[alembic]
script_location = database/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./data/yonder.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
