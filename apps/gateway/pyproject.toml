[project]
name = "yonder-gateway"
version = "0.1.0"
description = "Yonder Gateway — OpenAI-compatible control plane."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "yonder-contracts",
  "yonder-configuration",
  "yonder-telemetry",
  "pyjwt[crypto]>=2.10.0",
]

[project.scripts]
yonder-gateway = "app.main:run"
yonder-mcp = "app.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
yonder-contracts = { workspace = true }
yonder-configuration = { workspace = true }
yonder-telemetry = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
