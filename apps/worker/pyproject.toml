[project]
name = "yonder-worker"
version = "0.1.0"
description = "Yonder Worker Agent — hardware discovery, heartbeats, lifecycle."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "psutil>=6.1.0",
  "yonder-contracts",
  "yonder-configuration",
  "yonder-telemetry",
]

[project.scripts]
yonder-worker = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
yonder-contracts = { workspace = true }
yonder-configuration = { workspace = true }
yonder-telemetry = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
