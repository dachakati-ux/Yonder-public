# Official Google QAT GGUF (26B MoE, ~4B active). Loopback chat canary PASS on
# ai1 2026-08-02 (GPU 0, mmproj attached). Caps remain research_estimate until
# host measure. Alias stays operator-gated after a successful placed load.
id: yonder-gemma4-26b-a4b-it-qat-gguf
display_name: Gemma 4 26B A4B IT QAT GGUF
description: Gemma 4 MoE QAT GGUF for efficient reasoning on a single V100

source:
  type: local
  path: /srv/yonder-storage/model-bundles/gemma-4-26B-A4B-it-qat-gguf/gemma-4-26B_q4_0-it.gguf

runtime:
  provider: llama-cpp
  profile: chat
  model_identifier: gemma4-26b-a4b-it-qat-q4
  dtype: fp16
  quantization: int4
  # 2026-08-08 measure: 1× READY through 65536 (~17746 MiB). Default 32K.
  context_length: 131072
  tensor_parallel_size: 1
  mmproj_path: /srv/yonder-storage/model-bundles/gemma-4-26B-A4B-it-qat-gguf/gemma-4-26B-it-mmproj.gguf

requirements:
  minimum_gpu_memory_gb: 20
  supported_gpu_families:
    - volta
  placement_limits:
    single_gpu:
      max_context_length: 262144
      minimum_gpu_memory_gb: 20
      evidence: measured
    two_gpu:
      max_context_length: 262144
      minimum_gpu_memory_gb: 20
      evidence: measured

defaults:
  temperature: 1.0
  top_p: 0.95
  maximum_output_tokens: 2048

capabilities:
  - chat
  - streaming
