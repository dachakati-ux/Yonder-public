id: support-gateway-only
track: support
title: Gateway-only Support
summary: Support assistants still go through Yonder Gateway — never straight to workers
  or ticket DBs from the browser.
duration_minutes: 6
objectives:
- State the Gateway-only rule for Support copilots
- Name what must stay behind Gateway tools
sections:
- title: Same door
  body: Ticket triage and knowledge answers are Gateway-mediated. The console never
    opens a side channel to production systems.
- title: Why
  body: Trusted request context, allowlists, and honest failures live at the Gateway.
glossary_term_ids:
- gateway-only
- recipes
