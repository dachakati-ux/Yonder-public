id: operator-recipes-proof
track: operator
title: Recipes as ops proof
summary: Use Recipes to show how Gateway-mediated AI streamlines real ops workflows.
duration_minutes: 7
objectives:
- Run a Recipe deep-link
- Explain readiness badges
