[project]
name = "yonder-contracts"
version = "0.1.0"
description = "Shared typed contracts for Yonder gateway, worker, and console."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yonder_contracts"]
