[project]
name = "yonder-configuration"
version = "0.1.0"
description = "Typed configuration loading and validation for Yonder."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pyyaml>=6.0.2",
  "yonder-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yonder_configuration"]

[tool.uv.sources]
yonder-contracts = { workspace = true }
