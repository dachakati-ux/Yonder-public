[project]
name = "yonder-telemetry"
version = "0.1.0"
description = "Structured logging and metrics helpers for Yonder."
requires-python = ">=3.12"
dependencies = [
  "prometheus-client>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yonder_telemetry"]
