# Explicit opt-in; Docker socket grants host-level control.
# Do NOT expose controller port or run for school/production without a hardened
# separate-host/isolated runtime and security review.
services:
  gateway:
    environment:
      YONDER_ADDON_CONTROLLER_URL: http://addon-controller:8110
      YONDER_ADDON_CONTROLLER_TOKEN: ${YONDER_CONTROLLER_TOKEN:?Set a random controller secret}
  addon-controller:
    profiles: ["addon-controller"]
    build:
      context: .
      dockerfile: apps/addon-controller/Dockerfile
    environment:
      YONDER_CONTROLLER_TOKEN: ${YONDER_CONTROLLER_TOKEN:?Set a random controller secret}
      YONDER_CONTROLLER_DEPLOYMENTS: /etc/yonder/deployments.json
      YONDER_CONTROLLER_DB: /var/lib/yonder/controller.db
      YONDER_CONTROLLER_REQUIRE_SIGNATURES: "true"
      YONDER_CONTROLLER_RELEASE_ROOT: /etc/yonder/releases
      YONDER_CONTROLLER_PUBLISHER_KEYS: /etc/yonder/trust/publishers.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/addon-deployments.json:/etc/yonder/deployments.json:ro
      - ./config/addon-releases:/etc/yonder/releases:ro
      - ./config/addon-trust:/etc/yonder/trust:ro
      - addon_controller_state:/var/lib/yonder
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  addon_controller_state:
