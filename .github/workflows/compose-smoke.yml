name: Clean-host Compose smoke

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'config/**'
      - 'database/**'
      - 'addons/**'
      - 'scripts/**'
      - 'compose*.yaml'
      - 'start.sh'
      - '.env.example'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/compose-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: yonder-release-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Start fresh local stack on non-default host ports
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          YONDER_CONSOLE_PORT=3100
          YONDER_GATEWAY__PORT=8180
          YONDER_WORKER__PORT=8190
          YONDER_MCP_PORT=8195
          YONDER_CONSOLE_ORIGIN=http://127.0.0.1:3100
          NEXT_PUBLIC_YONDER_GATEWAY_URL=http://127.0.0.1:8180
          EOF
          docker compose config -q
          bash start.sh --yes
      - name: Check all published HTTP endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3100/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8180/health
          curl --fail --silent --show-error http://127.0.0.1:8180/v1/models
          curl --fail --silent --show-error http://127.0.0.1:8190/health
          curl --fail --silent --show-error http://127.0.0.1:8195/health
      - name: Recreate gateway and verify persistent database
        run: |
          docker compose exec -T gateway python -c 'import sqlite3; c=sqlite3.connect("/app/data/yonder.db"); assert c.execute("PRAGMA integrity_check").fetchone()==("ok",); c.execute("CREATE TABLE IF NOT EXISTS smoke_probe (id INTEGER PRIMARY KEY)"); c.execute("INSERT INTO smoke_probe VALUES (1)"); c.commit()'
          docker compose up -d --force-recreate --wait --wait-timeout 180 gateway
          docker compose exec -T gateway python -c 'import sqlite3; c=sqlite3.connect("/app/data/yonder.db"); assert c.execute("SELECT id FROM smoke_probe").fetchone()==(1,)'
      - name: Collect diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Remove disposable test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
