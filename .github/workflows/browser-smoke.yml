name: Console browser smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/console/**'
      - 'apps/gateway/**'
      - 'packages/**'
      - 'config/**'
      - 'compose*.yaml'
      - 'start.sh'
      - 'tests/browser/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: yonder-browser-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned browser test tools outside repository
        run: |
          npm install --prefix "$RUNNER_TEMP/yonder-browser" --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
          "$RUNNER_TEMP/yonder-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start local Compose stack
        run: bash start.sh --yes
      - name: Real browser acceptance
        run: |
          export YONDER_BROWSER_DEPS="$RUNNER_TEMP/yonder-browser"
          export YONDER_BROWSER_ARTIFACTS="$RUNNER_TEMP/yonder-browser-artifacts"
          node tests/browser/setup-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-browser-screenshots
          path: ${{ runner.temp }}/yonder-browser-artifacts
          if-no-files-found: ignore
      - name: Collect diagnostics and clean up
        if: always()
        run: |
          docker compose logs --no-color --tail=100 || true
          docker compose down --volumes --remove-orphans
