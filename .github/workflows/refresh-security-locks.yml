name: One-time security lock refresh
on:
  push:
    branches: [release/production-trust-and-audit]
    paths: ['.github/workflows/refresh-security-locks.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv python install 3.12
      - run: uv lock --upgrade-package certifi
      - run: uv pip compile --python-version 3.12 --generate-hashes apps/addon-controller/requirements.txt -o apps/addon-controller/requirements.lock.txt
      - working-directory: apps/console
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-security-locks
          path: |
            uv.lock
            apps/console/package-lock.json
            apps/addon-controller/requirements.lock.txt
          if-no-files-found: error
  commit-locks:
    needs: resolve
    if: github.repository == 'dachakati-ux/Yonder-public' && github.ref == 'refs/heads/release/production-trust-and-audit'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: refreshed-security-locks
      - name: Commit only generated lockfiles to review branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m json.tool apps/console/package-lock.json > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock apps/console/package-lock.json apps/addon-controller/requirements.lock.txt
          git diff --cached --stat
          git commit -m 'Refresh audited dependency locks'
          git push origin HEAD:refs/heads/release/production-trust-and-audit
